<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建筑施工项目总控工作台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== 全局变量与重置 ===== */
:root {
  --primary: #1a56a0;
  --primary-light: #2d7dd2;
  --primary-dark: #0f3d7a;
  --primary-bg: #e8f0fa;
  --success: #2e9e5b;
  --success-bg: #e6f7ed;
  --warning: #e8a317;
  --warning-bg: #fef6e4;
  --danger: #d9363e;
  --danger-bg: #fdecee;
  --info: #5c6c7c;
  --bg-page: #f0f2f5;
  --bg-card: #ffffff;
  --bg-sidebar: #0c2a4e;
  --bg-sidebar-hover: #163d6b;
  --bg-sidebar-active: #1a56a0;
  --text-primary: #1f2937;
  --text-secondary: #5c6c7c;
  --text-muted: #9ca3af;
  --text-sidebar: #c8d6e5;
  --border: #e2e8f0;
  --border-light: #edf0f3;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --radius: 4px;
  --radius-sm: 2px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: var(--text-primary); background: var(--bg-page); min-width: 1280px; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 13px; }
table { border-collapse: collapse; width: 100%; }

/* ===== 布局 ===== */
.app-layout { display: flex; height: 100vh; overflow: hidden; }

/* 侧边栏 */
.sidebar { width: 220px; background: var(--bg-sidebar); color: var(--text-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-logo { height: 56px; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar-logo svg { width: 28px; height: 28px; margin-right: 10px; flex-shrink: 0; }
.sidebar-logo-text { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; }
.sidebar-logo-text span { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.5); }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.nav-item { display: flex; align-items: center; padding: 10px 18px; cursor: pointer; transition: background 0.15s; font-size: 13px; color: var(--text-sidebar); border-left: 3px solid transparent; }
.nav-item:hover { background: var(--bg-sidebar-hover); color: #fff; }
.nav-item.active { background: var(--bg-sidebar-active); color: #fff; border-left-color: #4a9eff; font-weight: 500; }
.nav-item svg { width: 16px; height: 16px; margin-right: 10px; flex-shrink: 0; opacity: 0.8; }
.nav-item.active svg { opacity: 1; }
.nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; line-height: 1.5; }
.sidebar-footer { padding: 12px 18px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: rgba(255,255,255,0.4); }

/* 主内容区 */
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* 顶部栏 */
.topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; box-shadow: var(--shadow-sm); }
.topbar-project { display: flex; align-items: center; gap: 16px; }
.topbar-project-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.topbar-project-meta { display: flex; gap: 18px; font-size: 12px; color: var(--text-secondary); }
.topbar-project-meta .item { display: flex; align-items: center; gap: 4px; }
.topbar-project-meta .label { color: var(--text-muted); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.topbar-search { position: relative; }
.topbar-search input { width: 220px; height: 32px; border: 1px solid var(--border); border-radius: 16px; padding: 0 12px 0 32px; outline: none; background: var(--bg-page); }
.topbar-search input:focus { border-color: var(--primary-light); background: #fff; }
.topbar-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted); }
.topbar-icon-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); }
.topbar-icon-btn:hover { background: var(--bg-page); color: var(--primary); }
.topbar-icon-btn svg { width: 18px; height: 18px; }
.topbar-icon-btn .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid #fff; }
.topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
.topbar-user:hover { background: var(--bg-page); }
.topbar-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.topbar-user-info { font-size: 12px; }
.topbar-user-info .name { font-weight: 500; color: var(--text-primary); }
.topbar-user-info .role { color: var(--text-muted); font-size: 11px; }

/* 内容区 */
.content { flex: 1; overflow-y: auto; padding: 16px 20px; }
.content::-webkit-scrollbar { width: 6px; height: 6px; }
.content::-webkit-scrollbar-thumb { background: #c1c9d2; border-radius: 3px; }
.content::-webkit-scrollbar-track { background: transparent; }

/* 页面标题 */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.page-title { font-size: 18px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.page-title .subtitle { font-size: 12px; font-weight: 400; color: var(--text-muted); }
.page-actions { display: flex; gap: 8px; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; white-space: nowrap; }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-light); }
.btn-default { background: #fff; color: var(--text-primary); border-color: var(--border); }
.btn-default:hover { border-color: var(--primary-light); color: var(--primary); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b92b32; }
.btn-sm { height: 26px; padding: 0 10px; font-size: 11px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-link { color: var(--primary); background: none; padding: 0 4px; height: auto; }
.btn-link:hover { text-decoration: underline; }
.btn-link.danger { color: var(--danger); }

/* 卡片 */
.card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); margin-bottom: 14px; }
.card-header { padding: 12px 16px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.card-title::before { content: ''; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }
.card-body { padding: 14px 16px; }
.card-body.no-padding { padding: 0; }

/* 统计卡片 */
.stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 14px; }
.stat-card { background: #fff; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); position: relative; overflow: hidden; }
.stat-card .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.stat-card .stat-value { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
.stat-card .stat-value .unit { font-size: 12px; font-weight: 400; color: var(--text-muted); margin-left: 3px; }
.stat-card .stat-trend { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
.stat-card .stat-trend.up { color: var(--danger); }
.stat-card .stat-trend.down { color: var(--success); }
.stat-card .stat-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; opacity: 0.9; }
.stat-card .stat-icon svg { width: 20px; height: 20px; }
.stat-card.primary .stat-icon { background: var(--primary-bg); color: var(--primary); }
.stat-card.success .stat-icon { background: var(--success-bg); color: var(--success); }
.stat-card.warning .stat-icon { background: var(--warning-bg); color: var(--warning); }
.stat-card.danger .stat-icon { background: var(--danger-bg); color: var(--danger); }
.stat-card.info .stat-icon { background: #eef1f5; color: var(--info); }

/* 网格布局 */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
.grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }

/* 表格 */
.data-table { width: 100%; font-size: 12px; }
.data-table th { background: var(--bg-page); color: var(--text-secondary); font-weight: 500; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); }
.data-table tr:hover td { background: #f8fafc; }
.data-table .col-action { white-space: nowrap; }

/* 状态标签 */
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; line-height: 1.6; white-space: nowrap; }
.tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; margin-right: 4px; }
.tag-success { background: var(--success-bg); color: var(--success); }
.tag-success::before { background: var(--success); }
.tag-warning { background: var(--warning-bg); color: var(--warning); }
.tag-warning::before { background: var(--warning); }
.tag-danger { background: var(--danger-bg); color: var(--danger); }
.tag-danger::before { background: var(--danger); }
.tag-info { background: #eef1f5; color: var(--info); }
.tag-info::before { background: var(--info); }
.tag-primary { background: var(--primary-bg); color: var(--primary); }
.tag-primary::before { background: var(--primary); }
.tag-plain { background: #f3f4f6; color: var(--text-secondary); }
.tag-plain::before { background: var(--text-muted); }

/* 进度条 */
.progress-bar { width: 100%; height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
.progress-bar .fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.progress-bar .fill.primary { background: var(--primary); }
.progress-bar .fill.success { background: var(--success); }
.progress-bar .fill.warning { background: var(--warning); }
.progress-bar .fill.danger { background: var(--danger); }
.progress-with-text { display: flex; align-items: center; gap: 8px; }
.progress-with-text .progress-bar { flex: 1; }
.progress-with-text .progress-text { font-size: 11px; color: var(--text-secondary); min-width: 36px; text-align: right; }

/* 筛选栏 */
.filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.filter-bar .filter-item { display: flex; align-items: center; gap: 5px; }
.filter-bar label { font-size: 12px; color: var(--text-secondary); }
.filter-bar select, .filter-bar input { height: 28px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 8px; outline: none; background: #fff; font-size: 12px; min-width: 100px; }
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary-light); }

/* 图表容器 */
.chart-container { width: 100%; min-height: 280px; }
.chart-container.small { min-height: 200px; }
.chart-container.large { min-height: 360px; }

/* 风险等级标识 */
.risk-level { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
.risk-level .risk-dot { width: 8px; height: 8px; border-radius: 50%; }
.risk-low .risk-dot { background: var(--success); }
.risk-medium .risk-dot { background: var(--warning); }
.risk-high .risk-dot { background: var(--danger); }
.risk-low { color: var(--success); }
.risk-medium { color: var(--warning); }
.risk-high { color: var(--danger); }

/* 时间线 */
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 14px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before { content: ''; position: absolute; left: -19px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--primary); }
.timeline-item.danger::before { border-color: var(--danger); }
.timeline-item.warning::before { border-color: var(--warning); }
.timeline-item.success::before { border-color: var(--success); }
.timeline-time { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
.timeline-content { font-size: 12px; color: var(--text-primary); }
.timeline-content .title { font-weight: 500; margin-bottom: 2px; }
.timeline-content .desc { color: var(--text-secondary); font-size: 11px; }

/* 弹窗 */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: none; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 6px; width: 560px; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
.modal.large { width: 720px; }
.modal-header { padding: 14px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.modal-close { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); }
.modal-close:hover { background: var(--bg-page); color: var(--text-primary); }
.modal-close svg { width: 16px; height: 16px; }
.modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 8px; }

/* 表单 */
.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }
.form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 500; }
.form-label .required { color: var(--danger); margin-right: 2px; }
.form-control { width: 100%; height: 32px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 10px; outline: none; font-size: 12px; background: #fff; }
.form-control:focus { border-color: var(--primary-light); box-shadow: 0 0 0 2px rgba(45,125,210,0.1); }
textarea.form-control { height: auto; padding: 8px 10px; resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-readonly { background: var(--bg-page); color: var(--text-secondary); }

/* 详情列表 */
.detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.detail-item { display: flex; font-size: 12px; }
.detail-item .detail-label { color: var(--text-secondary); min-width: 80px; flex-shrink: 0; }
.detail-item .detail-value { color: var(--text-primary); font-weight: 500; }

/* 待办列表 */
.todo-list { list-style: none; }
.todo-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.todo-item:last-child { border-bottom: none; }
.todo-check { width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 3px; margin-top: 1px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.todo-check.checked { background: var(--primary); border-color: var(--primary); }
.todo-check.checked svg { width: 10px; height: 10px; color: #fff; }
.todo-content { flex: 1; min-width: 0; }
.todo-title { font-size: 12px; color: var(--text-primary); margin-bottom: 3px; }
.todo-item.done .todo-title { text-decoration: line-through; color: var(--text-muted); }
.todo-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 10px; }
.todo-priority { margin-left: auto; flex-shrink: 0; }

/* 空状态 */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 10px; opacity: 0.4; }

/* 分页 */
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 0; font-size: 12px; color: var(--text-secondary); }
.pagination-pages { display: flex; gap: 4px; }
.page-btn { min-width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; color: var(--text-primary); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
.page-btn:hover { border-color: var(--primary-light); color: var(--primary); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 图片占位框 */
.img-placeholder { width: 100%; height: 140px; background: linear-gradient(135deg, #e8edf3 0%, #d5dde7 100%); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; gap: 6px; }
.img-placeholder svg { width: 32px; height: 32px; opacity: 0.5; }

/* 滚动消息 */
.scroll-notice { background: var(--danger-bg); border-left: 3px solid var(--danger); padding: 8px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
.scroll-notice svg { width: 16px; height: 16px; color: var(--danger); flex-shrink: 0; }
.scroll-notice .notice-text { flex: 1; color: var(--danger); font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* 视图切换 */
.view-container { display: none; }
.view-container.active { display: block; }

/* 里程碑节点 */
.milestone-list { display: flex; flex-direction: column; gap: 0; }
.milestone-node { display: flex; gap: 12px; padding: 8px 0; position: relative; }
.milestone-node:not(:last-child)::after { content: ''; position: absolute; left: 9px; top: 24px; bottom: -8px; width: 2px; background: var(--border); }
.milestone-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; color: #fff; font-weight: 600; z-index: 1; }
.milestone-dot.done { background: var(--success); }
.milestone-dot.doing { background: var(--primary); }
.milestone-dot.todo { background: var(--text-muted); }
.milestone-dot.delay { background: var(--danger); }
.milestone-info { flex: 1; }
.milestone-name { font-size: 12px; font-weight: 500; color: var(--text-primary); }
.milestone-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* 快捷入口 */
.quick-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.quick-item { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius); padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.15s; }
.quick-item:hover { border-color: var(--primary-light); box-shadow: var(--shadow); transform: translateY(-1px); }
.quick-item .quick-icon { width: 36px; height: 36px; border-radius: 8px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; }
.quick-item .quick-icon svg { width: 18px; height: 18px; }
.quick-item .quick-name { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.quick-item .quick-count { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* 进度看板 */
.pg-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.pg-tab { height: 30px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #fff; font-size: 12px; color: var(--text-secondary); }
.pg-tab:hover { border-color: var(--primary-light); color: var(--primary); }
.pg-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pg-kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 10px; }
.pg-kpi { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius); padding: 12px 14px; }
.pg-kpi.accent { border-color: #86efac; background: #f0fdf4; }
.pg-kpi.lag { border-color: #f5c2c5; background: var(--danger-bg); }
.pg-kpi.lead { border-color: #86efac; background: #f0fdf4; }

function getEquipmentItems() {
  return (window.EQUIPMENT_DATA && EQUIPMENT_DATA.items) || [];
}
function getEquipmentMeta() {
  return window.EQUIPMENT_DATA || { snapshot_date: '', count: 0, items: [] };
}
function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
function parseDay(s) {
  if (!s) return null;
  const d = new Date(s + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}
function isOverdueItem(item, today) {
  if (item.status !== '未到货' || !item.planned_date) return false;
  const d = parseDay(item.planned_date);
  return !!(d && d < (today || startOfToday()));
}
function qtyOf(item) { return Number(item.quantity) || 0; }
function displayEquipName(name) {
  if (!name) return '—';
  const i = name.lastIndexOf(' / ');
  return i >= 0 ? name.slice(i + 3) : name;
}
function formatDay(s) { return s || '—'; }
function sumQty(list) { return list.reduce((n, i) => n + qtyOf(i), 0); }
function weightOf(item) { return Number(item.weight_t) || 0; }
function sumWeight(list) { return list.reduce((n, i) => n + weightOf(i), 0); }
function round1(n) { return Math.round(n * 10) / 10; }
function equipmentKpis() {
  const items = getEquipmentItems();
  const today = startOfToday();
  const notArrived = items.filter(i => i.status === '未到货');
  const inStock = items.filter(i => i.status === '已到货在库');
  const issued = items.filter(i => i.status === '已发放');
  const arrived = items.filter(i => i.status === '已发放' || i.status === '已到货在库');
  const overdue = items.filter(i => isOverdueItem(i, today));
  const lliPending = notArrived.filter(i => i.critical_item === 'LLI' || i.critical_item === 'Critical');
  const totalQty = sumQty(items);
  const arrivedQty = sumQty(arrived);
  return {
    items, today, notArrived, inStock, issued, arrived, overdue, lliPending,
    totalQty, arrivedQty,
    notArrivedQty: sumQty(notArrived),
    inStockQty: sumQty(inStock),
    issuedQty: sumQty(issued),
    overdueQty: sumQty(overdue),
    totalWeight: round1(sumWeight(items)),
    notArrivedWeight: round1(sumWeight(notArrived)),
    inStockWeight: round1(sumWeight(inStock)),
    issuedWeight: round1(sumWeight(issued)),
    rate: totalQty ? Math.round(arrivedQty / totalQty * 1000) / 10 : 0
  };
}
function renderStatusPie(elId, data, unit) {
  const el = document.getElementById(elId);
  if (!el || typeof echarts === 'undefined') return;
  const chart = echarts.init(el);
  chart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: {c} ' + unit + ' ({d}%)' },
    legend: { bottom: 0, textStyle: { fontSize: 11 } },
    series: [{
      type: 'pie',
      radius: ['42%', '68%'],
      center: ['50%', '44%'],
      label: { fontSize: 11 },

        { name: '已到货在库', value: data[1], itemStyle: { color: '#e8a317' } },
        { name: '已发放', value: data[2], itemStyle: { color: '#2e9e5b' } }
      ]
    }]
  });
  new ResizeObserver(() => chart.resize()).observe(el);
}

function initOverviewCharts() {
  const d = mockData.overview;
  const colors = { primary: '#1a56a0', success: '#2e9e5b', warning: '#e8a317', danger: '#d9363e' };
  const trend = (typeof progressOverviewTrend === 'function' && window.PROGRESS_DATA) ? progressOverviewTrend() : d.progressTrend;
  const yMax = Math.max(40, ...trend.map(i => Math.max(i.plan || 0, i.actual || 0))) + 10;

  // 进度趋势图
  const chartProgress = echarts.init(document.getElementById('chartProgress'));
  chartProgress.setOption({
    tooltip: { trigger: 'axis' },
    legend: { show: false },
    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
    xAxis: { type: 'category', data: trend.map(i => i.month), axisLine: { lineStyle: { color: '#e2e8f0' } }, axisLabel: { color: '#5c6c7c' } },
    yAxis: { type: 'value', max: yMax, axisLabel: { color: '#5c6c7c', formatter: '{value}%' }, splitLine: { lineStyle: { color: '#edf0f3' } } },
    series: [
      { name: '计划进度', type: 'line', data: trend.map(i => i.plan), smooth: true, lineStyle: { color: colors.primary, width: 2, type: 'dashed' }, itemStyle: { color: colors.primary }, symbol: 'circle', symbolSize: 6 },
      { name: '实际进度', type: 'line', data: trend.map(i => i.actual), smooth: true, lineStyle: { color: colors.success, width: 2.5 }, itemStyle: { color: colors.success }, symbol: 'circle', symbolSize: 7, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(46,158,91,0.2)' }, { offset: 1, color: 'rgba(46,158,91,0)' }]) } }
    ]
  });
  new ResizeObserver(() => chartProgress.resize()).observe(document.getElementById('chartProgress'));
  state.charts.progress = chartProgress;

  // 隐患分布饼图
  const chartHazard = echarts.init(document.getElementById('chartHazard'));
  chartHazard.setOption({
    title: { text: '隐患类型分布', left: 'center', top: 5, textStyle: { fontSize: 12, color: '#5c6c7c', fontWeight: 'normal' } },
    tooltip: { trigger: 'item', formatter: '{b}: {c}项 ({d}%)' },
    series: [{
      type: 'pie', radius: ['40%', '65%'], center: ['50%', '55%'],
      avoidLabelOverlap: true,
      itemStyle: { borderRadius: 2, borderColor: '#fff', borderWidth: 2 },
      label: { show: true, position: 'inside', formatter: '{d}%', fontSize: 10, color: '#fff' },
      labelLine: { show: false },
      data: d.hazardDistribution.map((item, i) => ({ ...item, itemStyle: { color: [colors.danger, colors.warning, colors.primary, '#5c6c7c', '#8b5cf6', '#94a3b8'][i] } }))
    }]
  });
  new ResizeObserver(() => chartHazard.resize()).observe(document.getElementById('chartHazard'));
  state.charts.hazard = chartHazard;

  // 劳务人数趋势
  const chartLabor = echarts.init(document.getElementById('chartLabor'));
  chartLabor.setOption({
    title: { text: '在场劳务人数趋势', left: 'center', top: 5, textStyle: { fontSize: 12, color: '#5c6c7c', fontWeight: 'normal' } },
    tooltip: { trigger: 'axis' },
    grid: { left: '3%', right: '5%', bottom: '8%', top: '25%', containLabel: true },
    xAxis: { type: 'category', data: d.laborTrend.map(i => i.month), axisLine: { lineStyle: { color: '#e2e8f0' } }, axisLabel: { color: '#5c6c7c', fontSize: 10 } },
    yAxis: { type: 'value', axisLabel: { color: '#5c6c7c', fontSize: 10 }, splitLine: { lineStyle: { color: '#edf0f3' } } },
    series: [{ type: 'bar', data: d.laborTrend.map(i => i.value), barWidth: '50%', itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: colors.primary }, { offset: 1, color: '#2d7dd2' }]), borderRadius: [3, 3, 0, 0] } }]
  });
  new ResizeObserver(() => chartLabor.resize()).observe(document.getElementById('chartLabor'));
  state.charts.labor = chartLabor;
}

    return true;
  });
  const pendingCount = mockData.safety.filter(i => i.status === 'pending').length;

  const closedCount = mockData.safety.filter(i => i.status === 'closed').length;

  const html = `

      <span style="color:var(--danger);font-weight:600;font-size:13px;">重大隐患醒目提醒：请立即采取措施，确保整改到位！</span>

function saveSafety(id) {
  const status = $('#editSafetyStatus').value;
  const item = mockData.safety.find(i => i.id === id);
  if (item) item.status = status;
  updateBadges();
  closeModal();
  renderSafety();
}

              <li class="todo-item ${t.status==='done'?'done':''}">
                <div class="todo-check ${t.status==='done'?'checked':''}" onclick="toggleTodo('${t.id}')">${t.status==='done'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
                <div class="todo-content">
                  <div class="todo-title">${t.title}</div>
                  <div class="todo-meta">
                    <span>类型：${t.type}</span>
                    <span>负责人：${t.responsible}</span>
                    <span style="color:${t.status==='overdue'?'var(--danger)':'var(--text-muted)'};">截止：${t.deadline}${t.status==='overdue'?' (已逾期)':''}</span>
                    <span>来源：${t.source}</span>
                  </div>
                </div>
                <div class="todo-priority">${t.priority==='high'?'<span class="tag tag-danger">高</span>':t.priority==='medium'?'<span class="tag tag-warning">中</span>':'<span class="tag tag-info">低</span>'}</div>
              </li>
            `).join('')}
          </ul>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">风险预警消息（按紧急程度排序）</div></div>
        <div class="card-body">
          <div class="timeline">
            ${d.riskAlerts.sort((a,b) => {
              const order = {high:0, medium:1, low:2};
              return order[a.level] - order[b.level];
            }).map(r => `
              <div class="timeline-item ${r.level==='high'?'danger':r.level==='medium'?'warning':'success'}">
                <div class="timeline-time">${r.time} | ${r.type}</div>
                <div class="timeline-content">
                  <div class="title" style="color:${r.level==='high'?'var(--danger)':r.level==='medium'?'var(--warning)':'var(--success)'};">${r.title}</div>
                  <div class="desc">${r.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
  $('#contentArea').innerHTML = html;
}
function toggleTodo(id) {
  const t = mockData.todos.find(i => i.id === id);
  if (t) {
    t.status = t.status === 'done' ? 'pending' : 'done';
    updateBadges();
    renderTodo();
  }
}

/* ===== 工具函数：更新角标 ===== */
function updateBadges() {
  const safetyPending = mockData.safety.filter(i => i.status !== 'closed').length;
  const hazardHigh = mockData.hazard.filter(h => h.riskLevel === 'high' && h.constructionStatus !== '已完成').length;
  const todoPending = mockData.todos.filter(t => t.status !== 'done' && t.status !== 'completed').length;
  const sb = $('#safetyBadge'); if (sb) sb.textContent = safetyPending;
  const hb = $('#hazardBadge'); if (hb) hb.textContent = hazardHigh;
  const tb = $('#todoBadge'); if (tb) tb.textContent = todoPending;
  const overdueN = equipmentKpis().overdue.length;
  const db = $('#deliveryBadge');
  if (db) {
    db.textContent = overdueN;
    db.style.display = overdueN ? '' : 'none';
  }
  const stamp = $('#sidebarDataStamp');
  const snap = getEquipmentMeta().snapshot_date;
  if (stamp) stamp.textContent = snap ? ('设备数据截至 ' + snap) : '设备数据未加载';
}

/* ===== 初始化 ===== */
document.addEventListener('DOMContentLoaded', function() {
  renderOverview();
  updateBadges();
});
// 兼容脚本在body末尾加载的情况
if (document.readyState !== 'loading') {
  renderOverview();
  updateBadges();
}
</script>
</body>
</html>
